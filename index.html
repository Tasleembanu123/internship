<!DOCTYPE html>
<html>
<head>
    <title>College Admission Form</title>
</head>
<body>
    <h2>College Admission Form</h2>
    <form>
        <label>Name:</label>
        <input type="text">
        <br><br>
        <label>Father Name</label>
        <input type="text">
        <br><br>
        <label>Email:</label>
        <input type="email">
        <br><br>
        <label>Phone number:</label>
        <input type="text" placeholder="Enter Phone num">
        <br><br>
        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>
        <label>Address:</label>
        <input type="text">
        <br><br>
        <label>Course:</label>
        <select>
            <option>Select Course</option>
            <option>BCA</option>
            <option>BBA</option>
            <option>B.Com</option>
            <option>B.Sc</option>
        </select>
        <br><br>
        <label>Marks card:</label>
        <input type="file"accept=".pdf">
        <br><br>
        <label>Upload:</label>
        <input type="file" accept="image">
        <br><br>
        <input type="Checkbox" id="declare">
        <label>declare agree
        </label>
        <br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
<head>

    <title>College Admission Form</title>

    <style>

        body {
            background-color: lightblue;
            font-family: Arial;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        form {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

    </style>

</head>
